name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke CLI against fixture
        run: |
          node dist/cli.js scan --field fixtures/minimal-field
          node dist/cli.js inspect fixtures/minimal-field
          node dist/cli.js lock reality-check --field fixtures/minimal-field
          node dist/cli.js doctor fixtures/minimal-field
          node dist/cli.js test reality-check --field fixtures/minimal-field
          node dist/cli.js export reality-check --field fixtures/minimal-field --target generic -o /tmp/tf-export
          test -f /tmp/tf-export/SKILL.md
